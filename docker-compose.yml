# Interiores IA — stack completo.
#   ./scripts/init-env.sh           # crea .env con secretos aleatorios (una vez)
#   docker compose up -d --build --wait
#   → http://localhost:8080
#
# Solo `web` publica un puerto. API, worker, IA, Postgres, Redis y S3 viven en la red
# interna. Los servicios one-shot (migrate, seed) corren y terminan antes de la API.
name: interiores

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # En la nube: define DATABASE_URL / REDIS_URL del servicio gestionado y listo.
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET}
  AI_SERVICE_URL: http://ai:8000
  AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-15}
  GENERATIONS_PER_DAY: ${GENERATIONS_PER_DAY:-40}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5-5}
  CHAT_PER_DAY: ${CHAT_PER_DAY:-60}
  RETENTION_HOURS: ${RETENTION_HOURS:-24}
  THROTTLE_LIMIT_PER_MIN: ${THROTTLE_LIMIT_PER_MIN:-240}
  RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: prod

services:
  # ------------------------------------------------------------------ borde
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: prod }
    image: interiores-web:local
    ports: ["${WEB_PORT:-8080}:8080"]
    environment:
      API_UPSTREAM: api:3000
    depends_on:
      api: { condition: service_healthy }
    networks: [edge, internal]
    restart: unless-stopped
    # Sistema de archivos de solo lectura salvo lo que nginx necesita escribir al arrancar.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /etc/nginx/conf.d:uid=101,gid=101
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
    logging: *logging

  # ------------------------------------------------------------------ aplicación
  api:
    build: *api-build
    image: interiores-api:local
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      ai: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped
    stop_grace_period: 20s
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
    logging: *logging

  worker:
    build: *api-build
    image: interiores-api:local
    command: ["node", "dist/worker.js"]
    environment: *api-env
    depends_on:
      # El layout automático necesita el catálogo cargado.
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      ai: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [internal]
    restart: unless-stopped
    # close() del worker espera a que terminen los jobs en curso
    stop_grace_period: 60s
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
    logging: *logging

  ai:
    build: { context: services/ai, target: prod }
    image: interiores-ai:local
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      ROOM_ANALYZER: ${ROOM_ANALYZER:-mock}
      STYLE_GENERATOR: ${STYLE_GENERATOR:-mock}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_DEPTH_MODEL: ${REPLICATE_DEPTH_MODEL:-chenxwh/depth-anything-v2}
      REPLICATE_STYLE_MODEL: ${REPLICATE_STYLE_MODEL:-adirik/interior-design}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen/qwen3.8-27b}
      VISION_PER_DAY: ${VISION_PER_DAY:-20}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      storage: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2.0", memory: 1G } } }
    logging: *logging

  # ------------------------------------------------------------------ tareas one-shot
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    image: interiores-api-migrate:local
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: "no"
    logging: *logging

  seed:
    build: *api-build
    image: interiores-api:local
    command: ["node", "dist/cli/seed.js"]
    environment:
      <<: *api-env
      CATALOG_OFFLINE: ${CATALOG_OFFLINE:-false}
      CATALOG_CACHE_DIR: /tmp/catalog-cache
    volumes: [catalog-cache:/tmp/catalog-cache]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy }
    # El seed necesita salida a internet para Poly Haven (si no hay, usa modelos procedurales).
    networks: [internal, edge]
    restart: "no"
    logging: *logging

  # ------------------------------------------------------------------ datos
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    shm_size: 128m
    logging: *logging

  redis:
    image: redis:7.4.11-alpine
    # BullMQ exige persistencia (AOF) y noeviction: un job nunca debe desaparecer por falta de memoria.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  storage:
    # SeaweedFS como S3 local (la imagen de MinIO dejó de publicarse en Docker Hub).
    # En la nube se reemplaza por S3/R2 cambiando solo S3_ENDPOINT y credenciales.
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=1024"]
    configs:
      - { source: s3_identities, target: /etc/seaweedfs/s3.json }
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1 || wget -qS -O- http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [internal]
    restart: unless-stopped
    logging: *logging

configs:
  s3_identities:
    content: |
      {"identities":[{"name":"interiores","credentials":[{"accessKey":"${S3_ACCESS_KEY_ID}","secretKey":"${S3_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

networks:
  edge: {}
  internal: {}

volumes:
  pgdata: {}
  redisdata: {}
  s3data: {}
  catalog-cache: {}
