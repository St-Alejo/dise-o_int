[project]
name = "interiores-ai"
version = "0.1.0"
description = "Microservicio de IA: room understanding, Track A (estilos) y Track B (layout de muebles)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "boto3>=1.43,<2",
  "opencv-python-headless>=4.11,<5",
  "numpy>=2.2,<3",
  "pillow>=12,<13",
  "structlog>=26,<27",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=6",
  "hypothesis>=6.168",
  "jsonschema>=4.26",
  "ruff>=0.16",
  "mypy>=2.3",
  "boto3-stubs[s3]>=1.43",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B007", "RUF059"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true
