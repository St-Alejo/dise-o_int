# Seguridad de dependencias (OSV-Scanner) y calidad de la web publicada (Lighthouse CI).
# Corre en cada push y PR, y cada lunes: aparecen vulnerabilidades nuevas aunque el código no cambie.
name: Calidad

on:
  push:
    branches: [main, conexion]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv:
    name: Dependencias (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Revisa cada archivo de dependencias (package-lock.json de la raíz y de e2e) contra osv.dev.
      # Falla si encuentra una vulnerabilidad que no esté justificada en osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./

  lighthouse:
    name: Lighthouse (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:types
      - run: npm run build -w web
      # Sirve el build de producción y mide portada, entrar y plantillas (3 corridas cada una).
      # Umbrales en apps/web/lighthouserc.json.
      - working-directory: apps/web
        run: npx -y @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
