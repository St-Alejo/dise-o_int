# Integración continua: cada push/PR pasa por pruebas unitarias de los 3 servicios,
# el test de contrato TS ↔ Python y un E2E real sobre el stack de Docker Compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  node:
    name: Tipos compartidos, API y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos compartidos (build + tests)
        run: |
          npm run build:types
          npm test -w @interiores/shared-types
      - name: El JSON Schema del contrato con la IA está actualizado
        run: |
          npm run schema -w @interiores/shared-types
          git diff --exit-code packages/shared-types/generated
      - name: API — tipos, lint y tests con cobertura
        run: |
          npm run typecheck -w api
          npm run lint -w api
          npm run test:cov -w api
      - name: Web — tests y build de producción (con presupuestos de bundle)
        run: |
          npm test -w web
          npm run build -w web

  ai:
    name: Servicio de IA (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - name: pytest (incluye el test de contrato contra el JSON Schema de zod)
        run: pytest --cov=interiores_ai --cov-report=term-missing

  e2e:
    name: E2E sobre Docker Compose
    runs-on: ubuntu-latest
    needs: [node, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Entorno con secretos aleatorios
        run: |
          ./scripts/init-env.sh
          # CI sin salida a Poly Haven garantizada: catálogo procedural (determinista y rápido)
          sed -i 's/^CATALOG_OFFLINE=.*/CATALOG_OFFLINE=true/' .env
      - name: Levantar el stack (espera healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Prueba de humo del backend
        run: node e2e/smoke.mjs http://localhost:8080
      - name: Playwright + axe
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 CI=1 npx playwright test
      - name: Logs del stack si algo falla
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-evidencias
          path: |
            compose-logs.txt
            e2e/playwright-report
            e2e/test-results
      - name: Apagar
        if: always()
        run: docker compose down -v
